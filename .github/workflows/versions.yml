name: Versions légères OmniRead Studio

on:
  push:
    branches: [main]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Branche ou commit du dépôt privé (main par défaut)"
        required: false
        type: string
        default: main

permissions:
  contents: read

concurrency:
  group: versions-legeres
  cancel-in-progress: false

jobs:
  preparer:
    if: vars.ACTIVATION_VERSIONS == 'oui'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      commit: ${{ steps.version.outputs.commit }}
      publier: ${{ steps.version.outputs.publier }}
    steps:
      - name: Lire le code privé
        uses: actions/checkout@v4
        with:
          repository: tanoudb/omni-trad-app
          ref: ${{ inputs.source_ref || 'main' }}
          ssh-key: ${{ secrets.SOURCE_STUDIO_SSH }}
          persist-credentials: false
      - name: Détecter une nouvelle version
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="v$(node -p "require('./app/package.json').version")"
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Version attendue : 1.2.3"; exit 1; }
          status=$(curl -sS -H "Authorization: Bearer $GH_TOKEN" -o /dev/null -w '%{http_code}' "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/tags/$VERSION")
          if [[ "$status" == 200 ]]; then publier=false
          elif [[ "$status" == 404 ]]; then publier=true
          else echo "Vérification de la version impossible (HTTP $status)."; exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "publier=$publier" >> "$GITHUB_OUTPUT"

  construire:
    needs: preparer
    if: needs.preparer.outputs.publier == 'true'
    runs-on: windows-latest
    timeout-minutes: 180
    env:
      VERSION: ${{ needs.preparer.outputs.version }}
    steps:
      - name: Vérifier la version
        shell: bash
        run: |
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Version attendue : v1.2.3"; exit 1; }

      - name: Lire le code privé à la même version
        uses: actions/checkout@v4
        with:
          repository: tanoudb/omni-trad-app
          ref: ${{ needs.preparer.outputs.commit }}
          ssh-key: ${{ secrets.SOURCE_STUDIO_SSH }}
          persist-credentials: false

      - name: Vérifier la version du produit
        shell: bash
        run: node -e "if ('v' + require('./app/package.json').version !== process.env.VERSION) process.exit(1)"

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Dépendances et tests
        shell: bash
        run: |
          uv sync --frozen
          uv run pytest -q --ignore=tests/apprentissage --ignore=tests/bancs/effacement --ignore=tests/bancs/lettrage --ignore=tests/lecture/test_vision.py
          npm ci --prefix app
          npm test --prefix app

      - name: Modèles légers publics
        run: uv run --no-sync python scripts/telecharger_modeles_pc.py modeles
      - name: Détecteur léger ONNX
        run: uv run --no-sync --with torch==2.15.0 --with transformers==5.22.1 --with onnx==1.23.2 python scripts/exporter_ogkalu.py --sortie modeles/ogkalu-onnx
      - name: Moteur compilé
        run: uv run --no-sync --with nuitka==4.3.4 python scripts/construire_app_pc.py build/nuitka --place-min 4
      - name: Préparer le moteur pour Electron
        shell: bash
        run: mv build/nuitka/omni_trad_pc.dist build/moteur

      - name: Tester le moteur Windows
        run: uv run --no-sync python scripts/essai_app_pc.py build/moteur/omni-trad-pc.exe

      - name: Construire l'installateur Windows
        working-directory: app
        run: npx electron-builder --win nsis --publish never

      - name: Installer et essayer l'application Windows
        shell: pwsh
        run: |
          $installateurs = @(Get-ChildItem app/dist/*.exe)
          if ($installateurs.Count -ne 1) { throw "Un seul installateur Windows est attendu." }
          $dossier = Join-Path $env:RUNNER_TEMP "OmniReadTest"
          $installation = Start-Process -FilePath $installateurs[0].FullName -ArgumentList "/S", "/D=$dossier" -PassThru
          if (-not $installation.WaitForExit(180000)) { Stop-Process -Id $installation.Id; throw "Installation trop longue." }
          if ($installation.ExitCode -ne 0) { throw "Installation refusée : $($installation.ExitCode)" }
          $exe = Join-Path $dossier "OmniRead Studio.exe"
          $moteur = Join-Path $dossier "resources/moteur/omni-trad-pc.exe"
          if (-not (Test-Path $exe) -or -not (Test-Path $moteur)) { throw "Application ou moteur absent après installation." }
          uv run --no-sync python scripts/essai_app_pc.py $moteur
          if ($LASTEXITCODE -ne 0) { throw "L'essai du moteur installé a échoué." }
          $env:OMNI_TRAD_DONNEES = Join-Path $env:RUNNER_TEMP "OmniReadDonneesTest"
          $app = Start-Process -FilePath $exe -PassThru
          try {
            Start-Sleep -Seconds 15
            $app.Refresh()
            if ($app.HasExited -or $app.MainWindowHandle -eq 0) { throw "L'application installée n'a pas ouvert sa fenêtre." }
          } finally {
            if (-not $app.HasExited) {
              $null = $app.CloseMainWindow()
              if (-not $app.WaitForExit(30000)) { Stop-Process -Id $app.Id; throw "L'application ne s'est pas fermée." }
            }
          }

      - name: Garder les fichiers de version
        uses: actions/upload-artifact@v4
        with:
          name: version-windows
          path: |
            app/dist/*.exe
            app/dist/*.exe.blockmap
            app/dist/latest.yml
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  publier:
    needs: [preparer, construire]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.preparer.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: version-*
          merge-multiple: true
          path: fichiers
      - name: Vérifier puis publier Windows
        shell: bash
        run: |
          test -f fichiers/latest.yml
          compgen -G 'fichiers/*.exe' >/dev/null
          if gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Cette version existe déjà : aucune publication écrasée."
            exit 1
          fi
          gh release create "$VERSION" fichiers/* --repo "$GITHUB_REPOSITORY" --title "OmniRead Studio $VERSION" --generate-notes
